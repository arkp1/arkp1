<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Good ideas start with hello.</title>
  <desc id="desc">Have a project, a question, or just want to talk code?</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142b2b"/><stop offset=".55" stop-color="#0c1a20"/><stop offset="1" stop-color="#111b29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d2fa82"/><stop offset="1" stop-color="#70e4c3"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#92eeb9" stop-opacity=".18"/><stop offset="1" stop-color="#92eeb9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a6f7d1" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="370" rx="24"/></clipPath>
  </defs>
  <style>
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="370" fill="url(#background)"/>
    <rect width="1200" height="370" fill="url(#grid)"/>
    <circle cx="1020" cy="160" r="260" fill="url(#glow)"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <circle cx="67" cy="55" r="5" fill="#c5f682"/>
      <text x="84" y="60" fill="#c5f682" font-size="14" font-weight="700" letter-spacing="2.4">A NOTE FROM PRANEET</text>
      <text x="60" y="141" fill="#f5f8f1" font-family="Georgia, 'Times New Roman', serif" font-size="76">Good ideas</text>
      <text x="58" y="226" fill="#d0f58f" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-style="italic">start with hello.</text>
      <text x="62" y="274" fill="#c4d5ce" font-size="25">Have a project, a question, or just want to talk code?</text>
      <text x="62" y="326" fill="#89aaa0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="1.2">IDEAS / QUESTIONS / COLLABORATION</text>
    </g>
    <circle cx="963" cy="175" r="145" fill="none" stroke="#b9f6cb" stroke-opacity=".15"/>
    <circle cx="963" cy="175" r="116" fill="none" stroke="#b9f6cb" stroke-opacity=".18" stroke-dasharray="5 12"/>
    <g transform="translate(862 99)">
      <rect width="202" height="148" rx="22" fill="#132a2b" stroke="#537569" stroke-width="1.5"/>
      <path d="M35 46h132v80H35z" fill="#1b3935" stroke="#98d9b1" stroke-width="2" stroke-linejoin="round"/>
      <path d="m36 49 65 45 65-45" fill="none" stroke="#c6f5aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="166" cy="32" r="17" fill="#d0f78d"/>
      <path d="M160 32h12m-6-6v12" stroke="#183028" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g class="pulse" fill="#c9f69a" stroke="#c9f69a" stroke-width="1.5">
      <circle cx="1102" cy="68" r="4"/>
      <path d="M821 269v14m-7-7h14" fill="none" stroke-linecap="round"/>
    </g>
    <rect y="364" width="1200" height="6" fill="url(#accent)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="368.5" rx="23.25" fill="none" stroke="#35514c" stroke-width="1.5"/>
</svg>
