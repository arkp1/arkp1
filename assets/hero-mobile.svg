<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">A.R.K. Praneet — full-stack developer</title>
  <desc id="desc">A dark, neon-accented introduction with an animated developer terminal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c24"/><stop offset="0.6" stop-color="#0a151c"/><stop offset="1" stop-color="#111725"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d2fa82"/><stop offset="1" stop-color="#70e4c3"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#56ce9b" stop-opacity="0.2"/><stop offset="1" stop-color="#56ce9b" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6f7d1" stroke-opacity="0.055"/></pattern>
    <clipPath id="frame"><rect width="720" height="620" rx="24"/></clipPath>
  </defs>
  <style>
    .spark { animation: breathe 4s ease-in-out infinite; }
    .cursor { animation: blink 1.3s steps(1, end) infinite; }
    @keyframes breathe { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 52% { opacity: 1; } 53%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .spark, .cursor { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="720" height="620" fill="url(#background)"/>
    <rect width="720" height="620" fill="url(#grid)"/>
    <circle cx="620" cy="175" r="300" fill="url(#glow)"/>
    <g class="spark" fill="#b4f5c9">
      <circle cx="625" cy="79" r="4"/><circle cx="573" cy="158" r="2.5"/>
      <path d="M655 192v20m-10-10h20" stroke="#b4f5c9" stroke-width="2"/>
    </g>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <rect x="48" y="48" width="12" height="12" rx="6" fill="#c5f682"/>
      <text x="72" y="59" fill="#c5f682" font-size="20" font-weight="700" letter-spacing="2.1">FULL-STACK DEVELOPER / INDIA</text>
      <text x="48" y="121" fill="#b8c8c8" font-size="28" font-weight="500">Hey, I’m</text>
      <text x="42" y="229" fill="#f4f8f3" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-style="italic" font-weight="700" letter-spacing="-4">Praneet<tspan fill="#c8f77f">.</tspan></text>
      <text x="48" y="286" fill="#c4d1cd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30">Turning ideas into useful things.</text>
      <text x="48" y="594" fill="#78938e" font-size="15" font-weight="600" letter-spacing="2">A.R.K. PRANEET <tspan fill="#557369">—</tspan> @ARKP1</text>
    </g>
    <g transform="translate(48 305)">
      <rect width="624" height="250" rx="18" fill="#09141a" fill-opacity="0.96" stroke="#35514c" stroke-width="1.5"/>
      <path d="M0 46H624" stroke="#2c4541"/>
      <circle cx="25" cy="23" r="5" fill="#f48883"/><circle cx="43" cy="23" r="5" fill="#f1cb78"/><circle cx="61" cy="23" r="5" fill="#a9df9a"/>
      <text x="600" y="28" fill="#728f89" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" text-anchor="end" letter-spacing="1">arkp1 / profile.ts</text>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="26">
        <text x="28" y="86" fill="#dbe9e1"><tspan fill="#8be5d3">const</tspan> praneet = {</text>
        <text x="28" y="120" fill="#dbe9e1" xml:space="preserve">  role: <tspan fill="#cafa88">"full-stack"</tspan>,</text>
        <text x="28" y="154" fill="#dbe9e1" xml:space="preserve">  builds: <tspan fill="#cafa88">"for the web"</tspan>,</text>
        <text x="28" y="188" fill="#dbe9e1" xml:space="preserve">  curiosity: <tspan fill="#b9a6fa">true</tspan></text>
        <text x="28" y="222" fill="#dbe9e1">};</text>
      </g>
      <rect class="cursor" x="69" y="202" width="11" height="21" rx="1" fill="#cafa88"/>
    </g>
    <rect x="0" y="614" width="720" height="6" fill="url(#accent)"/>
  </g>
  <rect x="0.75" y="0.75" width="718.5" height="618.5" rx="23.25" fill="none" stroke="#35514c" stroke-width="1.5"/>
</svg>
